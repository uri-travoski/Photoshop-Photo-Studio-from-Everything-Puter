appId: com.puter.photostudio
productName: Photo Studio
directories:
  output: release
files:
  - dist/**/*
  - public/icon-512.png
  - electron/**/*
extraMetadata:
  main: electron/main.cjs
linux:
  target:
    - target: deb
      arch:
        - x64
    - target: AppImage
      arch:
        - x64
  category: Graphics
  icon: public/icon-512.png
  synopsis: Professional Photo & Image Editor
  description: Professional photo and image editor for Linux.
  maintainer: Puter Team <support@puter.com>
deb:
  packageName: photo-studio
appImage:
  artifactName: Photo-Studio-${version}.AppImage
